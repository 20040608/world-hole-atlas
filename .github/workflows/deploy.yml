name: Test and deploy World Hole
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned upstream source and assets once
        if: ${{ hashFiles('src/core/world.ts') == '' }}
        run: |
          git clone https://github.com/SamadiPour/snack-hole-game.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout 2f1e5699eb08e19b6e6b76ab1e28055c9295a27b
          python3 - <<'PYIMPORT'
          import os, pathlib, shutil, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'upstream'
          for name in subprocess.check_output(['git', '-C', str(root), 'ls-files', '-z']).decode().split('\0'):
              if not name:
                  continue
              target = pathlib.Path(name)
              if not target.exists():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(root / name, target)
          PYIMPORT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import MIT upstream source and credited assets at pinned revision'
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
